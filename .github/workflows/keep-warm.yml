name: keep-warm

# Recovery net, not the primary keep-warm — cron-job.org handles that.
# Its 30s timeout can't outlast a ~60s Render cold start, so if the service
# ever does go down it fails every ping and disables itself after 25. This
# job's 90s timeout revives the container so those pings succeed again.
# Twice hourly at off-peak minutes: GitHub drops queued schedule events
# under load (worst at :00), so a */5 cadence never actually fired.
on:
  schedule:
    - cron: '7,37 0-4,12-23 * * *'  # ~7am-11pm CT, off the hour boundary
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          URL: https://aeria-api.onrender.com/api/health
        run: |
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 90 "$URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "attempt $attempt: 200 $(cat /tmp/body)"
              exit 0
            fi
            echo "attempt $attempt: http=$code (cold start or spin-up), retrying"
            sleep 30
          done
          echo "service did not respond after 5 attempts"
          exit 1
